<!DOCTYPE html>
<html>
<head>
    <title>Online Shopping</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #c2185b;        }
        header {
            background-color: #0097a7;
            color: white;
            text-align: center;
            padding: 20px;
        }
        nav {
            background-color: #144336;
            padding: 12px;
            text-align: center;
        }
        nav a {
            color: #37474f;
            text-decoration: none;
            margin: 20px;
        }
        h2 {
            text-align: center;
            color: #2874f0;
        }
        .products {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }
        .card {
            background: white;
            width: 220px;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 8px gray;
        }
        .card img {
            width: 180px;
            height: 150px;
            object-fit: contain;
        }
        .price {
            color: green;
            font-weight: bold;
        }
        button {
            background: #ff6e40;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }
        footer {
            background: #b388ff;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>

<header>
    <h1>MY ONLINE STORE</h1>
    <p>Welcome to Online Shopping</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">Offers</a>
    <a href="#">Contact</a>
</nav>

<h2>Our Products</h2>

<div class="products">

    <div class="card">
        <img src="https://www.soum.co.in/new_design_img/hero_mobiles_update.png" alt="Mobile">
        <h3>Smart Phone</h3>
        <p>Rating: 5 star </p>
        <p class="price">₹12,000</p>
        <p>20% Discount</p>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://www.cnet.com/wp-content/uploads/sites/2/a607f46f-73e9-4382-a9f7-b0b13093156e.png?resize=1200,675" alt="Laptop">
        <h3>Laptop</h3>
        <p>Rating: 4star </p>
        <p class="price">₹45,000</p>
        <p>10% Discount</p>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://assets.myntassets.com/w_200,q_50,,dpr_3,fl_progressive,f_webp/assets/images/2025/JULY/30/sb78vTLA_a73e97fd63244e3b8cd49f6f1d168bf8.jpg" alt="Headphones">
        <h3>Headphones</h3>
        <p>Rating: 5star </p>
        <p class="price">₹1,500</p>
        <p>15% Discount</p>
        <button>Add to Cart</button>
    </div>

</div>

<footer>
    <p>© 2026 My Online Store | All Rights Reserved</p>
</footer>

</body>
</html>
